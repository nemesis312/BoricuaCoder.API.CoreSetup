# Release: publishes BoricuaCoder.API.CoreSetup to nuget.org on a v*.*.* tag.
#
# Jobs: ci (reusable CI) -> build (read-only token, packs and uploads the
# packages and release notes) -> publish (environment nuget-release, no
# checkout: downloads the artifact, pushes to nuget.org, creates the release).
#
# Publishing uses NuGet Trusted Publishing (GitHub OIDC), so there is no
# long-lived API key secret. Owner prerequisites before the first tag:
#   1. On nuget.org, create a trusted-publishing policy for repository
#      nemesis312/BoricuaCoder.API.CoreSetup, workflow file release.yml and
#      environment nuget-release.
#   2. In the GitHub repo, create the Actions variable NUGET_USER set to the
#      nuget.org profile name that owns the package.
#   3. Create the GitHub environment nuget-release with a deployment tag rule
#      v* and a required reviewer.
#   4. Add a tag ruleset for v*: creation restricted to admins, no update and
#      no deletion.
#   5. The environment that holds CODECOV_TOKEN must allow tag refs, because
#      the ci job runs on the release tag.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main. Refusing to release."
            exit 1
          fi

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid version '$VERSION'"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty section '## [$VERSION]'."
            exit 1
          fi
          cat release-notes.md

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      # Build and pack use the same /p:Version so pack --no-build reuses this build.
      - name: Build
        run: dotnet build --no-restore --configuration Release /p:Version="$VERSION"

      - name: Pack
        run: |
          dotnet pack BoricuaCoder.API.CoreSetup/BoricuaCoder.API.CoreSetup.csproj \
            --no-build \
            --configuration Release \
            /p:Version="$VERSION" \
            --output ./nupkg

      - name: Upload packages and release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ./nupkg
            release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Download packages and release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release
          path: .

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing the .nupkg also pushes the matching .snupkg.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
