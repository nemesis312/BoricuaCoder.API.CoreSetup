# Release: publishes BoricuaCoder.API.CoreSetup to nuget.org on a v*.*.* tag.
#
# Publishing uses NuGet Trusted Publishing (GitHub OIDC), so there is no
# long-lived API key secret. Owner prerequisites before the first tag:
#   1. On nuget.org, create a trusted-publishing policy for repository
#      nemesis312/BoricuaCoder.API.CoreSetup and workflow file release.yml.
#   2. In the GitHub repo, create the Actions variable NUGET_USER set to the
#      nuget.org profile name that owns the package.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require tagged commit on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main. Refusing to release."
            exit 1
          fi

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty section '## [$VERSION]'."
            exit 1
          fi
          cat release-notes.md

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      # Build and pack use the same /p:Version so pack --no-build reuses this build.
      - name: Build
        run: dotnet build --no-restore --configuration Release /p:Version="$VERSION"

      - name: Pack
        run: |
          dotnet pack BoricuaCoder.API.CoreSetup/BoricuaCoder.API.CoreSetup.csproj \
            --no-build \
            --configuration Release \
            /p:Version="$VERSION" \
            --output ./nupkg

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing the .nupkg also pushes the matching .snupkg.
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
