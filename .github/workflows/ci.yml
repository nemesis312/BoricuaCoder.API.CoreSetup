name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: CODECOV_TOKEN

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Full suite, including [Trait("Category", "Integration")] tests that use
      # Testcontainers. ubuntu-latest ships Docker.
      - name: Test with coverage
        run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      # No /p:Version: the csproj fallback (1.5.0-local) keeps package
      # validation against the 1.4.2 baseline running on every PR.
      - name: Pack (package validation)
        run: dotnet pack BoricuaCoder.API.CoreSetup/BoricuaCoder.API.CoreSetup.csproj -c Release --no-build -o ./nupkg-ci

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.6.1

      - name: Generate coverage report
        run: reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage/report -reporttypes:Html

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ./coverage/report

      - name: Code coverage summary
        run: |
          echo "## Code Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
          reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage/summary -reporttypes:TextSummary
          cat ./coverage/summary/Summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
